<html lang="en">

</head>

          <path d="M74.3724 15.9216L86.6466 36.8327L42.9504 112.492H67.8571L111.405 37.428L99.1313 15.9216H74.3724Z" fill="currentColor"/>
          <path d="M111.37 37.6615L68.2155 112.412C68.0767 112.652 67.8212 112.799 67.5436 112.799H43.4312C43.3048 112.799 43.1826 112.768 43.073 112.71C42.9439 112.645 42.8342 112.542 42.7592 112.412L30.703 91.5285C30.5642 91.2883 30.5642 90.994 30.703 90.7538L73.8577 16.0037C73.9965 15.7635 74.2519 15.6163 74.5296 15.6163H98.642C98.9197 15.6163 99.1751 15.7635 99.314 16.0037L111.37 36.8868C111.509 37.127 111.509 37.4213 111.37 37.6615Z" stroke="currentColor" stroke-width="3" stroke-miterlimit="10"/>

        </svg>
        <h1>Webrix Guard</h1>
      </div>
      <span class="version">v1.0.0</span>
    </header>

    <div class="status-bar" id="statusBar">
      <span class="status-dot"></span>
      <span class="status-text" id="statusText">Scanning...</span>
    </div>

    <div class="stats">
      <div class="stat">
        <span class="stat-value" id="blockedCount">0</span>
        <span class="stat-label">Blocked</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="allowedCount">0</span>
        <span class="stat-label">Allowed</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="totalCount">0</span>
        <span class="stat-label">Total</span>
      </div>
    </div>

    <div class="recent-section">
      <h2>Recent Activity</h2>
      <div class="events-list" id="eventsList">
        <div class="empty-state">No events yet</div>
      </div>
    </div>

    <div class="actions">
      <button class="btn btn-primary" id="openDashboard">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        Open Dashboard
      </button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
