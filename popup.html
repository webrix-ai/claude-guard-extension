<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      </svg>
      <span>Claude Guard</span>
    </div>
    <span class="badge" id="statusBadge">Inactive</span>
  </header>

  <section class="setting">
    <div class="setting-info">
      <div class="setting-label">Auto Mode</div>
      <div class="setting-desc">Block non-GET same-site or auth-header requests</div>
    </div>
    <label class="toggle">
      <input type="checkbox" id="autoMode">
      <span class="slider"></span>
    </label>
  </section>

  <hr>

  <section class="list-section">
    <div class="list-head">
      <h3>Allow List <span class="count" id="allowCount">0</span></h3>
      <button class="icon-btn" id="addAllow" title="Add allow rule">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M12 5v14M5 12h14"/>
        </svg>
      </button>
    </div>
    <div class="add-form" id="allowForm" hidden>
      <input type="text" id="allowPattern" placeholder="*://api.example.com/*" spellcheck="false">
      <select id="allowMethod">
        <option value="*">All Methods</option>
        <option value="POST">POST</option>
        <option value="PUT">PUT</option>
        <option value="PATCH">PATCH</option>
        <option value="DELETE">DELETE</option>
      </select>
      <div class="form-btns">
        <button class="btn-text" data-cancel="allow">Cancel</button>
        <button class="btn-sm" data-confirm="allow">Add</button>
      </div>
    </div>
    <div class="rules" id="allowList"></div>
  </section>

  <hr>

  <section class="list-section">
    <div class="list-head">
      <h3>Block List <span class="count" id="blockCount">0</span></h3>
      <button class="icon-btn" id="addBlock" title="Add block rule">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M12 5v14M5 12h14"/>
        </svg>
      </button>
    </div>
    <div class="add-form" id="blockForm" hidden>
      <input type="text" id="blockPattern" placeholder="*://evil.example.com/*" spellcheck="false">
      <select id="blockMethod">
        <option value="*">All Methods</option>
        <option value="GET">GET</option>
        <option value="POST">POST</option>
        <option value="PUT">PUT</option>
        <option value="PATCH">PATCH</option>
        <option value="DELETE">DELETE</option>
      </select>
      <div class="form-btns">
        <button class="btn-text" data-cancel="block">Cancel</button>
        <button class="btn-sm" data-confirm="block">Add</button>
      </div>
    </div>
    <div class="rules" id="blockList"></div>
  </section>

  <hr>

  <section class="setting">
    <div class="setting-info">
      <div class="setting-label">Redaction</div>
      <div class="setting-desc">Remove sensitive text &amp; elements from pages while the agent is active</div>
    </div>
    <label class="toggle">
      <input type="checkbox" id="redactEnabled">
      <span class="slider"></span>
    </label>
  </section>

  <section class="list-section">
    <div class="list-head">
      <h3>Guards <span class="count" id="guardCount">0</span></h3>
      <label class="min-certainty" title="Checks rated below this certainty are ignored">
        <span>Min. certainty</span>
        <select id="guardMinCertainty" aria-label="Minimum certainty"></select>
      </label>
    </div>
    <div class="guards" id="guardList"></div>
  </section>

  <section class="list-section">
    <div class="list-head">
      <h3>Custom Rules <span class="count" id="redactCount">0</span></h3>
      <button class="icon-btn" id="addRedact" title="Add redaction rule">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M12 5v14M5 12h14"/>
        </svg>
      </button>
    </div>
    <div class="add-form" id="redactForm" hidden>
      <select id="redactKind" aria-label="Rule kind">
        <option value="text">Exact text (case-insensitive)</option>
        <option value="regex">Regular expression</option>
        <option value="selector">CSS selector (remove element)</option>
      </select>
      <input type="text" id="redactValue" placeholder="Text to redact" spellcheck="false">
      <input type="text" id="redactScope" placeholder="Scope (optional) — *://bank.example.com/*" spellcheck="false">
      <div class="form-error" id="redactError" hidden></div>
      <div class="form-btns">
        <button class="btn-text" data-cancel="redact">Cancel</button>
        <button class="btn-sm" data-confirm="redact">Add</button>
      </div>
    </div>
    <div class="rules" id="redactList"></div>
  </section>

  <hr>

  <footer>
    <div class="stats">
      <div class="stat">
        <span class="num" id="blockedNum">0</span>
        <span class="lbl">blocked</span>
      </div>
      <div class="stat">
        <span class="num" id="allowedNum">0</span>
        <span class="lbl">allowed</span>
      </div>
      <div class="stat">
        <span class="num" id="redactedNum">0</span>
        <span class="lbl">redacted</span>
      </div>
    </div>
    <button class="btn-text btn-reset" id="clearStats">Reset</button>
  </footer>

  <script src="lib/guards.js"></script>
  <script src="lib/redactor.js"></script>
  <script src="popup.js"></script>
</body>
</html>
