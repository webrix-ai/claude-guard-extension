<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Blocked by Claude Guard</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #f8f8f8;
      color: #222;
      text-align: center;
      padding: 40px;
      box-sizing: border-box;
    }
    svg { margin-bottom: 24px; }
    h1 { font-size: 28px; font-weight: 700; margin: 0 0 12px; }
    p { font-size: 16px; color: #666; margin: 0 0 16px; }
    code {
      font-size: 13px;
      background: #eee;
      padding: 6px 12px;
      border-radius: 6px;
      word-break: break-all;
      max-width: 600px;
      display: inline-block;
    }
  </style>
</head>
<body>
  <svg width="64" height="64" viewBox="0 0 64 64" fill="none">
    <circle cx="32" cy="32" r="32" fill="#ff3b30" opacity=".12"/>
    <path d="M32 18v16M32 42v2" stroke="#ff3b30" stroke-width="3" stroke-linecap="round"/>
  </svg>
  <h1>Blocked by Claude Guard</h1>
  <p>Navigation to this URL is not allowed.</p>
  <code id="url"></code>
  <script>
    try {
      var url = new URLSearchParams(location.search).get('url') || '';
      document.getElementById('url').textContent = url;
    } catch (e) {}
  </script>
</body>
</html>
