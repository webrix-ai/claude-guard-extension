name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint & test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test

  package:
    name: Package extension
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run pack:zip

      - name: Verify manifest version matches package.json
        run: |
          test "$(node -p "require('./manifest.json').version")" = "$(node -p "require('./package.json').version")"

      - uses: actions/upload-artifact@v4
        with:
          name: claude-guard-zip
          path: dist/*.zip
          if-no-files-found: error
